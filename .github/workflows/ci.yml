name: Own-source verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: own-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@11.20.0
      - run: rustup toolchain install 1.92 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: pnpm lens:build
      - run: pnpm build
      - run: pnpm package:stage
      - run: pnpm lens:demo
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: node packages/lens/dist/schema.js --check
      - run: pnpm learning:check
      - run: pnpm package:smoke

# This tests our own source changes with read-only credentials. It is NOT a
# consumer Action that builds an analyzer from an untrusted target repository.
